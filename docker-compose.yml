services:
  backend:
    image: ${DOCKERHUB_USERNAME}/ascend-backend:latest
    container_name: ascend-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    networks:
      - ascend-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/ascend-frontend:latest
    container_name: ascend-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - ascend-network

networks:
  ascend-network:
    driver: bridge
